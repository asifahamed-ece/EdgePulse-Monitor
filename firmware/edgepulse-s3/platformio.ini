; ═══════════════════════════════════════════════════════════════════════
;  EdgePulse — ESP32-S3 firmware
;  Board: Espressif ESP32-S3-DevKitC-1 (generic)
; ═══════════════════════════════════════════════════════════════════════

[platformio]
data_dir = ../../dashboard/data

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 921600
upload_speed = 921600
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
upload_protocol = esptool

board_build.filesystem = littlefs

lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit MPU6050 @ ^2.2.9
    milesburton/DallasTemperature @ ^3.11.0

    ; ── OPTIONAL: ST7789 TFT status display ──────────────────────────
    ; COMMENTED OUT ON PURPOSE. The display is off by default
    ; (EDGE_TFT_ENABLED = 0 in src/TftDisplay.h), so the panel libraries
    ; must not be pulled into the default build: they add roughly 250 kB of
    ; flash and a second font/glyph library to a firmware that never opens
    ; a display.
    ;
    ; TO ENABLE, in this order:
    ;   1. uncomment the two library lines below,
    ;   2. uncomment -DEDGE_TFT_ENABLED=1 in build_flags,
    ;   3. wire the panel per docs/WIRING.md.
    ; Nothing in TftDisplay.cpp or main.cpp changes; both are already behind
    ; the gate.
    ;
    ; Adafruit's driver is used rather than TFT_eSPI for one reason: it takes
    ; the panel's pins as constructor arguments. TFT_eSPI compiles them into
    ; a User_Setup.h, which would stop include/pins.h from being the single
    ; source of truth the moment a display is attached.
    ;adafruit/Adafruit GFX Library
    ;adafruit/Adafruit ST7735 and ST7789 Library

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; -DEDGE_TFT_ENABLED=1
